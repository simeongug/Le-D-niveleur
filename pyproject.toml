[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deniveleur"
version = "0.3.0"
description = "Générateur de boucles trail à dénivelé positif maximal ou ciblé, avec export GPX."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Siméon" }]
dependencies = [
    "numpy>=2.0",
    "osmium>=4.0",
    "pyproj>=3.6",
    "tifffile>=2024.1",
    "matplotlib>=3.8",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
deniveleur = "deniveleur.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deniveleur"]

[tool.hatch.build.targets.wheel.force-include]
"src/deniveleur/config/parametres.toml" = "deniveleur/config/parametres.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W : style, F : erreurs probables, I : ordre des imports,
# B : pièges classiques, UP : syntaxe moderne, SIM : simplifications.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
