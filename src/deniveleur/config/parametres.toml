# Paramètres du Déniveleur.
# Tout ce qui se règle est ici : aucune valeur « magique » dans le code.

[zones.ouest-parisien]
nom = "Ouest parisien, de Meudon à Montmartre"
region = "ile-de-france"
# 26 km × 22 km : de Marnes-la-Coquette à la Villette, de Clamart à Gennevilliers.
emprise_l93 = [632000, 6850000, 658000, 6872000]

[zones.saint-cloud-meudon]
nom = "Saint-Cloud / Sèvres / Meudon / Chaville / Ville-d'Avray"
region = "ile-de-france"
# Emprise en Lambert-93 (mètres) : ouest, sud, est, nord. Multiples de la taille des dalles.
emprise_l93 = [636000, 6852000, 648000, 6864000]

[osm]
# Geofabrik publie un extrait par jour ; « latest » est résolu vers la version datée.
url_base = "https://download.geofabrik.de/europe/france"
fichier = "ile-de-france-latest.osm.pbf"
# Types de voies gardés (tag OSM « highway »).
voies = [
  "path", "footway", "track", "steps", "pedestrian", "bridleway", "cycleway",
  "living_street", "residential", "service", "unclassified", "tertiary",
  "secondary", "primary", "tertiary_link", "secondary_link", "primary_link",
]
# Valeurs qui interdisent le passage à pied.
acces_interdit = ["private", "no", "customers", "delivery", "military", "permit"]
# Types de voies considérés comme du chemin (par opposition au bitume) quand la
# surface n'est pas renseignée.
voies_chemin = ["path", "track", "bridleway"]
surfaces_dures = [
  "asphalt", "paved", "concrete", "concrete:plates", "concrete:lanes",
  "paving_stones", "sett", "cobblestone", "unhewn_cobblestone", "metal", "wood",
]

[altitude]
# Service IGN (Géoplateforme) : RGE ALTI, altitude du sol.
url = "https://data.geopf.fr/wms-r"
couche = "ELEVATION.ELEVATIONGRIDCOVERAGE.HIGHRES"
# Taille d'un pixel en mètres. Le RGE ALTI est natif à 1 m ; 2 m suffit pour des
# chemins et divise le volume par 4.
resolution_m = 2
# Côté d'une dalle en mètres.
taille_dalle_m = 2000
# En dessous de cette valeur, le pixel est considéré comme « sans donnée ».
altitude_min_valide = -100
# Le service renvoie parfois une dalle incomplète : nombre d'essais, et pause (multipliée
# par le numéro de l'essai) entre deux essais.
essais_par_dalle = 4
pause_entre_essais_s = 5

[profil]
# Distance entre deux points d'altitude le long d'un chemin.
pas_m = 5
# Largeur de la moyenne glissante qui lisse le profil.
lissage_m = 30
# Une montée ne compte que si elle dépasse ce seuil (filtre le bruit).
hysteresis_m = 2

[carte]
url_fond = "https://data.geopf.fr/wms-r"
couche_fond = "GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2"
# Taille de l'image en pixels (côté le plus long).
taille_px = 3000
# Bornes de pente (en %) pour les couleurs : plat, faux plat, côte, raide, mur.
paliers_pente = [3, 6, 10, 15]
couleurs = ["#2e9e4f", "#b5cf2d", "#f5b400", "#f0641e", "#c4002f"]

[moteur]
# --- Demande par défaut ---
# Tolérance sur la distance demandée (0.05 = ±5 %).
tolerance = 0.05
# Temps de recherche en secondes (hors préparation, environ 3 s de plus).
budget_s = 25
# Où viser dans la tolérance : 0 = pile la distance demandée, 1 = le maximum permis.
# Plus de distance donne plus de D+, on vise donc plutôt haut.
visee_dans_tolerance = 0.6

# --- Ce qu'on garde du réseau ---
# Au-delà de cette pente, un tronçon (hors escalier) est jugé faux : mur, passage
# souterrain mal décrit. Il est écarté.
pente_max_plausible_pct = 45
escaliers = true
# Le départ est déplacé au carrefour utilisable le plus proche, dans cette limite.
ecart_depart_max_m = 300
# On ne regarde pas plus loin du départ que cette part de la distance demandée.
rayon_max_part = 0.35
# Nombre de points (espacés de 5 m) pour mesurer la direction d'un tronçon à un carrefour.
portee_cap_points = 3

# --- Ce qui est interdit ou pénalisé ---
# Virage plus serré que cet angle = demi-tour.
angle_demi_tour_deg = 160
# Passage « en double » : repasser à moins d'une case ou deux d'un endroit déjà
# traversé (deux trottoirs d'une même rue, deux allées collées).
double_case_m = 15
# … sauf si c'est la suite immédiate du parcours (moins de cette distance avant).
double_ecart_min_m = 150
# Un croisement n'est pas un passage en double : en dessous de cette longueur, on tolère.
croisement_max_m = 80
# Part de la distance qu'on tolère en double pour qu'une boucle soit acceptée.
double_tolere_part = 0.005
# Pénalités, en mètres de D+ retirés de la note.
penalite_double_par_m = 0.3
penalite_double_exact_par_m = 1.0
penalite_demi_tour_m = 30
penalite_trop_long_par_m = 0.25
penalite_trop_court_par_m = 0.05

# --- Points d'ancrage (hauts et bas de versants) ---
ancre_case_m = 250
ancre_relief_min_m = 8
# Nombre d'ancres voisines envisagées à chaque étape.
voisines = 40
liaison_min_m = 120
liaison_max_m = 2500

# --- Construction d'une boucle en zigzag ---
# Rayon du cercle-guide autour duquel tourne le parcours, en part de la distance.
guide_rayon_part = [0.024, 0.105]
# Écart toléré autour du cercle-guide, en part de la distance.
guide_bande_part = 0.024
# Force du rappel vers le cercle-guide (mètres de D+ par mètre d'écart).
rappel_guide = [0.005, 0.03]
# Ce que doit rapporter chaque mètre parcouru (mètres de D+ par mètre).
cout_par_m = [0.01, 0.04]
# Part de hasard dans le choix de l'étape suivante (en mètres de D+).
bruit_m = 3
# Quand la distance restante se resserre, on favorise ce qui rapproche du départ.
rappel_depart = 0.06
rappel_depart_des_part = 0.095
# Marge gardée pour rentrer : distance au départ × ce facteur + ces mètres.
marge_retour = 1.1
marge_retour_m = 200
# Si une liaison commence par rebrousser chemin sur plus de cette part, on la refuse.
recul_max_part = 0.5
# Nombre de cases déjà occupées qu'une liaison peut traverser (un croisement).
recouvrement_max_cases = 6
retours_arriere_max = 40

# Préférence « plutôt sentier » ou « plutôt route » (ou part minimale de sentier) :
# mètres de D+ « offerts » par mètre de la voie préférée, pour orienter la recherche.
prime_voie_par_m = 0.03

# --- D+ cible ---
# Poids du dénivelé dans le choix des étapes, tiré au hasard dans cette fourchette
# (négatif = on évite les côtes).
poids_vertical_cible = [-0.4, 1.0]
# À écart égal avec la cible, une boucle 100 % sur la voie préférée vaut ce nombre de
# mètres de mieux.
cible_bonus_voie_m = 15
# Au-delà de cet écart (part de la cible), on prévient que la cible n'est pas tenue.
cible_ecart_alerte_part = 0.1

# --- Retour au départ ---
# Pour rentrer, les tronçons déjà pris comptent cette fois plus longs, et ceux qui
# les longent (au moins cette part de leurs cases) aussi.
retour_penalite_pris = 50
retour_penalite_proche = 8
retour_part_proche = 0.5
# Si le retour ne passe pas, on recule d'une étape, jusqu'à ce nombre de fois.
fermetures_max = 6

# --- Pilotage de la recherche ---
# Part du temps passée à explorer au hasard, avant d'approfondir les meilleures pistes.
part_exploration = 0.4
guides_gardes = 6
variation_guide = 0.15
# Deux propositions doivent différer sur au moins cette part de leur longueur.
difference_min_part = 0.4

# --- Allers-retours acceptés ---
# Quand l'option est choisie : les culs-de-sac sont gardés, chaque tronçon peut être pris
# une fois dans chaque sens, et ces réglages remplacent ceux du dessus.
[moteur.allers_retours]
# Part du temps de recherche passée sur des boucles strictes, gardées pour comparaison.
part_temps_strict = 0.5
# Part maximale de la distance parcourue deux fois.
aller_retour_max_part = 0.2
# Pénalités modérées : on accepte les allers-retours, on ne les recherche pas. La
# meilleure boucle est celle qui a la meilleure note (D+ moins ces pénalités).
penalite_double_par_m = 0.0
penalite_double_exact_par_m = 0.1
penalite_demi_tour_m = 15
# Pour rentrer, les tronçons déjà pris sont seulement un peu évités.
retour_penalite_pris = 2
retour_penalite_proche = 1.5

[montees]
# Une montée « principale » gagne au moins cette hauteur…
denivele_min_m = 15
# … sans redescendre de plus de ceci en chemin.
replat_max_m = 6
# Fenêtre de mesure de la pente maximale.
fenetre_pente_m = 50

[cotes]
# Côtes pour intervalles : on cherche des montées qui durent environ le temps demandé.
# Distance maximale (par les chemins) entre le départ et le bas de la côte.
rayon_m = 3000
# Nombre de côtes proposées.
nombre = 5
# Allure à plat pendant l'intervalle (4:30 /km), convertie en temps de montée avec la
# même règle que pour les boucles (100 m de D+ ≈ 1 km de plat).
allure_s_par_km = 270
# Écart accepté entre la durée estimée et la durée demandée (0.15 = ±15 %).
tolerance_duree = 0.15
# Pente moyenne minimale pour qu'une montée compte comme une côte.
pente_min_pct = 4
# Redescente maximale tolérée au milieu de la côte (sous le point le plus haut atteint).
replat_max_m = 4
# Virage plus serré que cet angle = demi-tour, refusé.
angle_virage_max_deg = 120
# Bas de côte possibles : le point le plus bas de chaque case de cette taille.
case_bas_m = 150
# À chaque carrefour, nombre de continuations explorées (les plus montantes).
branches = 3
# Limite d'exploration par bas de côte (temps de calcul).
chemins_explores_par_bas = 400
# Note d'une côte = son dénivelé, moins ces pénalités (en mètres).
penalite_descente = 3
# Un intervalle se court mal dans des escaliers : on les évite autant que possible.
penalite_escaliers_par_m = 0.5
penalite_approche_par_km = 5
penalite_ecart_duree_par_pct = 0.5
# Deux côtes proposées ne doivent pas partager plus de cette part de leur longueur.
recouvrement_max_part = 0.3

[temps]
# Estimation simple : chaque tranche de ce nombre de mètres de D+ compte comme un
# kilomètre de plat de plus (règle courante en trail : 100 m de D+ ≈ 1 km).
dplus_par_km_effort_m = 100
# Allure à plat par défaut, en secondes par kilomètre (6:00 /km).
allure_plat_s_par_km = 360

[site]
# Temps de recherche par demande, en secondes.
budget_s = 25
# Temps de préparation prévu en plus (pour la barre d'avancement).
preparation_prevue_s = 3
# Au-delà de ce nombre de demandes en attente, les nouvelles sont refusées.
file_max = 10
# Nombre de calculs gardés en mémoire (pour pouvoir retélécharger les GPX).
calculs_gardes = 200
# Espacement des points envoyés à la page (le GPX, lui, garde tous les points).
pas_trace_m = 20
# Point de départ proposé à l'ouverture : rue Dailly, Saint-Cloud.
depart_defaut = [48.8428, 2.2215]
